<!doctype html><html dir="rtl" lang="ar"><head><meta charset="utf-8">
<title>تصدير أيقونة إسلام</title></head>
<body style="background:#111;display:flex;flex-direction:column;align-items:center;gap:28px;padding:40px;font-family:sans-serif">
<p style="color:#3AC9A0;font-size:20px">معاينة أيقونة «إسلام» — اضغط الزر لتحميل PNG ‏1024×1024 بالخط المتشكّل</p>
<div id="icon" style="width:512px;height:512px">
<!-- محتوى app_icon.svg يُلصق هنا داخل وسم svg -->
</div>
<button onclick="exportPng()" style="font-size:20px;padding:14px 36px;border-radius:12px;border:none;background:#0E6B5C;color:#fff;cursor:pointer">⬇ تحميل PNG ‏1024×1024</button>
<script>
function exportPng(){
  const svg=document.getElementById('icon').querySelector('svg');
  const xml=new XMLSerializer().serializeToString(svg);
  const img=new Image();
  img.onload=()=>{const c=document.createElement('canvas');
    c.width=1024;c.height=1024;
    c.getContext('2d').drawImage(img,0,0,1024,1024);
    const a=document.createElement('a');
    a.download='app_icon_1024.png';a.href=c.toDataURL('image/png');a.click();};
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(xml);}
</script></body></html>
